name: Publiceren

# Bouwt de website, episodes.json (voor de app) en de RSS-feed (voor Spotify en Apple Podcasts)
# en zet alles op GitHub Pages. De audio komt uit GitHub Releases.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "episodes/**"
      - "podcast.toml"
      - "assets/art/**"
      - "studio/site.py"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: studio/requirements.txt
      - run: pip install -r studio/requirements.txt
      - name: Audio ophalen uit Releases
        run: |
          mkdir -p build/audio
          for id in $(python -m studio window); do
            gh release download "aflevering-$id" --pattern "$id.mp3" --dir build/audio --skip-existing \
              || echo "::warning::Geen audio gevonden voor $id"
          done
      - run: python -m studio site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
