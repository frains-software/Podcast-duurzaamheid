name: Studio

# De studio maakt van een redactiescript een aflevering:
#  - push:      de dagelijkse Claude-routine (of een mens) pusht redactie/JJJJ-MM-DD.json
#  - schedule:  vangnet om 09:25 Nederlandse tijd; ontbreekt de aflevering, dan schrijft Claude hem zelf
#  - handmatig: Actions → Studio → Run workflow
on:
  push:
    paths: ["redactie/*.json"]
  schedule:
    - cron: "25 7 * * *" # 09:25 zomertijd (CEST)
    - cron: "25 8 * * *" # 09:25 wintertijd (CET)
  workflow_dispatch:
    inputs:
      date:
        description: "Datum (JJJJ-MM-DD), leeg = vandaag"
        required: false
        default: ""
      force:
        description: "Opnieuw maken, ook als de aflevering al bestaat"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: studio
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Laatste stand van main ophalen
        run: |
          git fetch origin main
          # Afleveringen altijd van main lezen, zodat een wachtende run niets dubbel maakt.
          git checkout origin/main -- episodes 2>/dev/null || true
          if [ "${{ github.event_name }}" != "push" ]; then
            git checkout origin/main -- redactie 2>/dev/null || true
          fi

      - name: Gewijzigde scripts
        id: changed
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            files=$(git diff --name-only origin/main...HEAD -- 'redactie/*.json'; git show --name-only --format= HEAD -- 'redactie/*.json')
          else
            files=$(git diff --name-only "$before" "${{ github.sha }}" -- 'redactie/*.json')
          fi
          echo "files=$(echo $files)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: studio/requirements.txt
      - run: pip install -r studio/requirements.txt

      - name: Plan
        id: plan
        run: >-
          python -m studio plan
          --event "${{ github.event_name }}"
          --date "${{ inputs.date }}"
          --force "${{ inputs.force }}"
          --changed "${{ steps.changed.outputs.files }}"

      - name: ffmpeg
        if: steps.plan.outputs.action != 'skip'
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Schrijven met Claude (vangnet)
        if: steps.plan.outputs.action == 'write'
        run: python -m studio write "${{ steps.plan.outputs.date }}"

      - name: Controleren
        if: steps.plan.outputs.action != 'skip'
        run: python -m studio validate "${{ steps.plan.outputs.date }}"

      - name: Inspreken en monteren (ElevenLabs Eleven v4)
        if: steps.plan.outputs.action != 'skip'
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::Het geheim ELEVENLABS_API_KEY ontbreekt (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          python -m studio produce "${{ steps.plan.outputs.date }}"

      - name: Audio archiveren in GitHub Releases
        if: steps.plan.outputs.action != 'skip'
        run: |
          d="${{ steps.plan.outputs.date }}"
          tag="aflevering-$d"
          title=$(python -c "import json;print(json.load(open('episodes/$d.json'))['title'])")
          python -c "import json;print(json.load(open('episodes/$d.json'))['summary'])" > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "build/audio/$d.mp3" --clobber
          else
            gh release create "$tag" "build/audio/$d.mp3" --title "Grondstof $d · $title" --notes-file notes.md --target main
          fi

      - name: Vastleggen op main
        if: steps.plan.outputs.action != 'skip'
        run: |
          d="${{ steps.plan.outputs.date }}"
          title=$(python -c "import json;print(json.load(open('episodes/$d.json'))['title'])")
          cp "redactie/$d.json" "$RUNNER_TEMP/script.json"
          cp "episodes/$d.json" "$RUNNER_TEMP/episode.json"
          git config user.name "Grondstof studio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard -q
          git checkout -B main origin/main
          mkdir -p redactie episodes
          cp "$RUNNER_TEMP/script.json" "redactie/$d.json"
          cp "$RUNNER_TEMP/episode.json" "episodes/$d.json"
          git add "redactie/$d.json" "episodes/$d.json"
          git commit -m "Aflevering $d: $title" || echo "Niets nieuws om vast te leggen"
          git push origin main
          branch="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "push" ] && [ "$branch" != "main" ]; then
            git push origin --delete "$branch" || true
          fi

      - name: Website en feed publiceren
        if: steps.plan.outputs.action != 'skip'
        run: gh workflow run publish.yml --ref main

      - name: Samenvatting
        if: always()
        run: |
          echo "### Grondstof ${{ steps.plan.outputs.date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Actie: **${{ steps.plan.outputs.action }}** · ${{ steps.plan.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
